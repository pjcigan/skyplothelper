# ReadTheDocs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  # nbsphinx renders the tutorial notebooks via pandoc, which isn't in the
  # default RTD image.
  apt_packages:
    - pandoc

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

# Install the package (so autodoc can import it) plus the docs extra.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

# Build the HTML output (the default). Add 'pdf'/'epub' here if wanted later.
formats: []
